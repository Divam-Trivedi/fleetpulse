<!doctype html>
<html><head><meta charset="utf-8"><title>FleetPulse data flow</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#667085;--line:#b6bfca;--py:#d7f3ec;--pyS:#0f766e;--aws:#ffeedd;--awsS:#c2410c;--sf:#dfeaff;--sfS:#1d4ed8;--pk:#0f766e;--al:#dc2626;--pnl:#f6f8fa}
@media (prefers-color-scheme:dark){:root{--bg:#0e1117;--fg:#e6edf3;--mut:#9aa4b2;--line:#4a5260;--py:#0f3d38;--pyS:#5eead4;--aws:#3b2412;--awsS:#fdba74;--sf:#13284f;--sfS:#93c5fd;--pk:#5eead4;--al:#f87171;--pnl:#151a22}}
body{margin:0;padding:8px;background:var(--bg);color:var(--fg);font:13px system-ui,Segoe UI,sans-serif}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
button{background:var(--pnl);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font:inherit}
button.on{border-color:var(--pyS);box-shadow:inset 0 0 0 1px var(--pyS)}
#now{margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--pnl);min-height:34px}
#note{color:var(--mut);font-size:12px;margin-top:4px}
svg{display:block;width:100%;height:auto}
</style></head><body>
<div id="bar">
  <b>Path:</b>
  <button id="bJ">JSON</button><button id="bP">Parquet</button><button id="bB" class="on">Both</button>
  <label>Speed <input id="spd" type="range" min="0.5" max="3" step="0.25" value="1"></label>
  <button id="bPause">Pause</button>
</div>
<svg id="stage" viewBox="0 0 1000 540" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="now">Starting...</div>
<div id="note">Not to scale. Real delays: Firehose buffer up to 60 s, Snowpipe about 1 min, each dynamic table up to 5 min, alert schedule every 5 min. Counters are illustrative.</div>
<script>
const NS="http://www.w3.org/2000/svg",svg=document.getElementById("stage");
const el=(n,a,p,t)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!==undefined)e.textContent=t;(p||svg).appendChild(e);return e};
const C={py:["--py","--pyS"],aws:["--aws","--awsS"],sf:["--sf","--sfS"]};
// ---- layout ----
[[10,20,190,300,"Python (laptop or EC2)","py"],[215,20,385,335,"AWS: ingestion","aws"],[215,410,490,115,"AWS: alerting","aws"],[625,20,365,375,"Snowflake","sf"]].forEach(([x,y,w,h,t,g])=>{
  el("rect",{x,y,width:w,height:h,rx:12,style:"fill:var(--pnl);stroke:var(--line)","stroke-dasharray":"4 3"});
  el("text",{x:x+10,y:y+14,"font-size":11,style:"fill:var(--mut)"},null,t)});
const N={
 robots:{x:30,y:60,w:150,h:62,t:"Robots",s:"30 simulated AMRs",g:"py"},
 pub:{x:30,y:225,w:150,h:62,t:"Batch publisher",s:"500 readings per call",g:"py"},
 fhj:{x:235,y:45,w:150,h:62,t:"Firehose (JSON)",s:"GZIP newline-delimited",g:"aws"},
 fhp:{x:235,y:255,w:150,h:84,t:"Firehose (Parquet)",s:"Glue schema, Snappy",g:"aws"},
 s3j:{x:430,y:45,w:150,h:62,t:"S3 raw/",s:"json.gz files",g:"aws"},
 s3p:{x:430,y:255,w:150,h:84,t:"S3 raw_parquet/",s:"parquet files",g:"aws"},
 sqs:{x:430,y:150,w:150,h:52,t:"S3 event to SQS",s:"new-file notice",g:"aws"},
 pipe:{x:645,y:150,w:130,h:52,t:"Snowpipe",s:"auto-ingest",g:"sf"},
 raw:{x:810,y:40,w:160,h:58,t:"RAW (VARIANT)",s:"append-only",g:"sf"},
 stg:{x:810,y:128,w:160,h:58,t:"STAGING",s:"typed, deduplicated",g:"sf"},
 feat:{x:810,y:216,w:160,h:58,t:"ML features",s:"per-robot baselines",g:"sf"},
 score:{x:810,y:304,w:160,h:70,t:"RISK_SCORES",s:"SQL model view",g:"sf"},
 eb:{x:235,y:445,w:130,h:58,t:"EventBridge",s:"schedule",g:"aws"},
 lam:{x:395,y:445,w:130,h:58,t:"Lambda",s:"query + dedupe",g:"aws"},
 sns:{x:555,y:445,w:135,h:58,t:"SNS",s:"email topic",g:"aws"},
 mail:{x:730,y:445,w:150,h:58,t:"To Inbox",s:"",g:"py"}};
for(const k in N){const n=N[k],g=el("g");
  n.box=el("rect",{x:n.x,y:n.y,width:n.w,height:n.h,rx:8,style:`fill:var(${C[n.g][0]});stroke:var(${C[n.g][1]})`,"stroke-width":1.3},g);
  el("text",{x:n.x+8,y:n.y+17,"font-size":12.5,"font-weight":600,style:"fill:var(--fg)"},g,n.t);
  el("text",{x:n.x+8,y:n.y+31,"font-size":10.5,style:"fill:var(--mut)"},g,n.s);
  n.ct=el("text",{x:n.x+8,y:n.y+n.h-7,"font-size":11,style:`fill:var(${C[n.g][1]})`},g,"");n.flash=0}
const E={rp:[[105,122],[105,225]],pj:[[180,245],[208,245],[208,76],[235,76]],pp:[[180,267],[235,297]],
 js:[[385,76],[430,76]],ps:[[385,297],[430,297]],sj:[[505,107],[505,150]],sp:[[505,255],[505,202]],
 qp:[[580,176],[645,176]],pr:[[775,176],[795,176],[795,69],[810,69]],rs:[[890,98],[890,128]],sf:[[890,186],[890,216]],fc:[[890,274],[890,304]],
 el:[[365,474],[395,474]],ls:[[525,474],[555,474]],sm:[[690,474],[730,474]],lq:[[470,445],[810,350]]};
for(const k in E){E[k].len=[];E[k].tot=0;for(let i=1;i<E[k].length;i++){const l=Math.hypot(E[k][i][0]-E[k][i-1][0],E[k][i][1]-E[k][i-1][1]);E[k].len.push(l);E[k].tot+=l}
  el("polyline",{points:E[k].map(p=>p.join(",")).join(" "),fill:"none",style:"stroke:var(--line)","stroke-width":1.4,"stroke-dasharray":["qp","lq","sj","sp"].includes(k)?"4 3":""})}
const lab=(x,y,t)=>el("text",{x,y,"font-size":10,style:"fill:var(--mut)"},null,t);
lab(112,178,"readings");lab(40,305,"PutRecordBatch (HTTPS)");lab(595,170,"auto-ingest");lab(610,432,"query ML.RISK_SCORES");lab(897,117,"dynamic table");lab(897,205,"dynamic table");lab(897,293,"SQL view");
// Parquet conversion icon inside Firehose (Parquet)
const conv=el("g");el("text",{x:243,y:313,"font-size":10,style:"fill:var(--mut)"},conv,"{json} to columns");
const bars=[0,1,2,3,4].map(i=>el("rect",{x:338+i*7,y:300,width:5,height:12,style:"fill:var(--awsS)",opacity:.35},conv));
// ---- simulation ----
const S={mode:"both",pubBuf:0,recs:0,batches:0,fh:{j:0,p:0},files:{j:0,p:0},events:0,loads:0,raw:0,stg:0,feat:0,scored:0,pending:0,flagged:0,ticks:0,runs:0,sent:0,mails:0,conv:0,msg:""};
let P=[],T=[],acc={rec:0,eb:0},speed=1,paused=false,clock=0;
const later=(s,f)=>T.push({at:clock+s,f});
const shape=k=>k==="file"?el("rect",{width:11,height:11,rx:2,style:"fill:var(--awsS)"}):k==="batch"?el("rect",{width:9,height:9,style:"fill:var(--pyS)"}):
  k==="evt"?el("circle",{r:5,fill:"none",style:"stroke:var(--awsS)","stroke-width":2}):k==="alert"?el("circle",{r:6,style:"fill:var(--al)"}):
  k==="query"?el("circle",{r:4,style:"fill:var(--sfS)"}):k==="load"?el("rect",{width:10,height:10,rx:2,style:"fill:var(--sfS)"}):el("circle",{r:3.2,style:"fill:var(--pk)"});
const spawn=(id,kind,dur,done,rev)=>P.push({id,kind,dur,t:0,done,rev:!!rev,el:shape(kind)});
function at(id,f,rev){const e=E[id];let d=(rev?1-f:f)*e.tot;for(let i=0;i<e.len.length;i++){if(d<=e.len[i]||i===e.len.length-1){const r=Math.min(1,d/e.len[i]);return[e[i][0]+(e[i+1][0]-e[i][0])*r,e[i][1]+(e[i+1][1]-e[i][1])*r]}d-=e.len[i]}}
const now=t=>{S.msg=t};
const hit=n=>{N[n].flash=1};
function sendBatch(){const tg=S.mode==="both"?["j","p"]:[S.mode==="json"?"j":"p"];S.batches++;now("The simulator batches 500 readings and calls PutRecordBatch.");
  tg.forEach(x=>spawn(x==="j"?"pj":"pp","batch",1.0,()=>{hit(x==="j"?"fhj":"fhp");S.fh[x]++;
    if(S.fh[x]>=10){S.fh[x]=0;if(x==="p"){S.conv=1;now("Firehose converts JSON to columns using the Glue schema and writes Parquet.")}else now("Firehose flushes its buffer as one gzip JSON file.");
      spawn(x==="j"?"js":"ps","file",0.9,()=>{hit(x==="j"?"s3j":"s3p");S.files[x]++;now("A new file lands in S3. S3 notifies Snowpipe through SQS.");
        spawn(x==="j"?"sj":"sp","evt",0.6,()=>{hit("sqs");S.events++;spawn("qp","evt",0.6,()=>{hit("pipe");later(0.8,()=>spawn("pr","load",0.9,()=>load(x)))})})})}}))}
function load(x){hit("raw");S.loads++;S.raw+=5000;now("Snowpipe loads the file into RAW. A dynamic table then types and deduplicates it.");
  later(1.4,()=>spawn("rs","load",0.6,()=>{hit("stg");S.stg+=5000;later(1.4,()=>spawn("sf","load",0.6,()=>{hit("feat");S.feat+=80;now("Features are built per robot against its own baseline.");
    later(1.2,()=>spawn("fc","load",0.6,()=>{hit("score");S.scored+=80;S.pending+=Math.random()<0.75?1+(Math.random()<0.4?1:0):0;now("The model scores each robot-minute in plain SQL.")}))}))}))}
function schedule(){hit("eb");S.ticks++;now("EventBridge fires on schedule and invokes the Lambda.");
  spawn("el","evt",0.6,()=>{hit("lam");S.runs++;spawn("lq","query",1.5,()=>{hit("score");
    spawn("lq","query",1.5,()=>{if(S.pending>0){const n=S.pending;S.pending=0;S.flagged+=n;now("New at-risk robots found, logged for dedupe, and published to SNS.");
      spawn("ls","alert",0.6,()=>{hit("sns");S.sent++;spawn("sm","alert",0.6,()=>{hit("mail");S.mails++;now(n+" robot(s) at risk: email delivered.")})})}else now("Lambda finds no new alerts, so nothing is sent.")},true)})})}
function tick(dt){if(paused)return;dt*=speed;clock+=dt;
  acc.rec+=dt;while(acc.rec>=0.17){acc.rec-=0.17;S.recs+=1;spawn("rp","rec",0.7,()=>{hit("robots");S.pubBuf++;if(S.pubBuf>=5){S.pubBuf=0;hit("pub");sendBatch()}})}
  acc.eb+=dt;if(acc.eb>=16){acc.eb=0;schedule()}
  for(let i=T.length-1;i>=0;i--)if(clock>=T[i].at){const f=T[i].f;T.splice(i,1);f()}
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.t+=dt/p.dur;if(p.t>=1){p.el.remove();P.splice(i,1);p.done&&p.done();continue}
    const[x,y]=at(p.id,p.t,p.rev);p.el.setAttribute(p.el.tagName==="circle"?"cx":"x",x-(p.el.tagName==="circle"?0:5));p.el.setAttribute(p.el.tagName==="circle"?"cy":"y",y-(p.el.tagName==="circle"?0:5))}
  for(const k in N){const n=N[k];n.flash=Math.max(0,n.flash-dt*2.2);n.box.setAttribute("stroke-width",1.3+n.flash*3.5)}
  S.conv=Math.max(0,S.conv-dt*0.8);bars.forEach((b,i)=>{b.setAttribute("opacity",0.3+0.7*S.conv);b.setAttribute("height",8+((i*5)%4)*3*S.conv+4)});
  const f=v=>v.toLocaleString("en-US");
  N.robots.ct.textContent="published "+f(S.recs*100);N.pub.ct.textContent=f(S.batches)+" batches sent";
  N.fhj.ct.textContent="buffer "+Math.round(S.fh.j*6)+" s of 60";N.fhp.ct.textContent="buffer "+Math.round(S.fh.p*6)+" s of 60";
  N.s3j.ct.textContent=S.files.j+" files";N.s3p.ct.textContent=S.files.p+" files";N.sqs.ct.textContent=S.events+" notices";
  N.pipe.ct.textContent=S.loads+" loads";N.raw.ct.textContent=f(S.raw)+" rows";N.stg.ct.textContent=f(S.stg)+" rows";N.feat.ct.textContent=f(S.feat)+" windows";
  N.score.ct.textContent=S.flagged+" flagged, "+S.pending+" waiting";N.eb.ct.textContent=S.ticks+" triggers";N.lam.ct.textContent=S.runs+" runs";N.sns.ct.textContent=S.sent+" published";N.mail.ct.textContent=S.mails+" emails";
  document.getElementById("now").textContent=S.msg||"Starting..."}
// ---- controls ----
function setMode(m){S.mode=m;["J","P","B"].forEach(k=>document.getElementById("b"+k).classList.toggle("on",k===m[0].toUpperCase()||(m==="both"&&k==="B")));}
document.getElementById("bJ").onclick=()=>setMode("json");document.getElementById("bP").onclick=()=>setMode("parquet");document.getElementById("bB").onclick=()=>setMode("both");
document.getElementById("spd").oninput=e=>speed=+e.target.value;
document.getElementById("bPause").onclick=e=>{paused=!paused;e.target.textContent=paused?"Resume":"Pause"};
let last=performance.now();function loop(t){tick(Math.min(0.1,(t-last)/1000));last=t;requestAnimationFrame(loop)}
window.__fp={tick,S,N,setMode};
if(!window.__NOLOOP)requestAnimationFrame(loop);
</script></body></html>
