[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetpulse"
version = "0.1.0"
description = "Configurable robot fleet telemetry simulator"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "PyYAML>=6.0"]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
analytics = ["snowflake-snowpark-python>=1.20", "pandas", "scikit-learn"]
dev = ["pytest>=8.0", "boto3>=1.34"]

[project.scripts]
fleetpulse = "fleetpulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
